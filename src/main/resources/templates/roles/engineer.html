<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Engineer</title>
<link rel="stylesheet" th:href="@{/css/engineer.css}">
</head>
<body>

    <form th:object="${engineerModel}" method="post" th:action="@{/subEngineer}">
         <h1>Personal Information Of Engineer</h1>
         <br><br>
	
         <label>Name : <input type="text" placeholder="Enter your name."  th:field="*{name}"></label>
         <label>Email : <input type="email" placeholder="Enter registered email."  th:field="*{email}"></label>
         <label>Mobile No. : <input type="text" placeholder="Enter your mobile number."  th:field="*{mobileNumber}"></label>
         <label>Experience : <input type="number" placeholder="Enter your experience in years"  th:field="*{experience}"></label>
         <label>Previous Project : <input type="text" placeholder="Enter previous project."  th:field="*{prevProject}"></label>
         <label>Expected Salary : <input type="number" placeholder="Enter expected salary."  th:field="*{expectedSalary}"></label>
         <label>Experties : <input type="text" placeholder="Enter experties." th:field="*{experties}"></label>
         <button type="submit">Submit</button>
    </form>
</body>
</html>
