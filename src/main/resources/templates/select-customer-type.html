<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Customer Type</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }
h2 {
        text-align: center;
        font-size: 2.2em;
        font-weight: 700;
        background: linear-gradient(90deg, #ff7e5f, #feb47b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 35px;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    form {
        background-color: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 300px;
    }

    select {
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 25px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1em;
        outline: none;
        transition: all 0.3s ease;
    }

    select:focus {
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0,123,255,0.5);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        font-size: 1em;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        background-color: #0056b3;
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    @media (max-width: 400px) {
        form {
            width: 90%;
            padding: 30px;
        }
    }
</style>
</head>
<body>


<form th:action="@{/customer/dashboard}" th:object="${customerDashboard}" method="post">
    <h2>Select Customer Type</h2>
    <select th:field="*{customerType}" required>
        <option value="" disabled selected>Select Type</option>
        <option value="ApartmentBuyers">Apartment Buyer</option>
        <option value="OwnLandConstruction">Own Land Construction</option>
        <option value="LandAndHouseBuilder">Land And House Builder</option>
    </select>
    <button type="submit">Go</button>
</form>

</body>
</html>
